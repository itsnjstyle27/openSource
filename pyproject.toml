[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statkit"
version = "0.1.0"
description = "Small, dependency-free descriptive statistics helpers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["statkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
